{% extends 'base.html' %}

{% block head %}
<title>Task Priority</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1>Task Priority</h1>

    <div class="form_and_date">
        <form action="/" method="POST">

            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <br>

            <label for="priority">Ticket Priority</label>
            <select id="priority" name="priority" required>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
            <br>

            <label for="description">Describe the issue briefly</label>
            <input type="text" id="description" name="description" required>
            <br>

            <label for="issuetype">Select Issue Type</label>
            <select id="issuetype" name="issuetype" required>
                <option value="Computer Issues - Work Stoppage">Computer Issues - Work Stoppage</option>
                <option value="Ticket Issues - Work Stoppage">Ticket Issues - Work Stoppage</option>
                <option value="Computer Issues - Non Work Stoppage">Computer Issues - Non Work Stoppage</option>
                <option value="Ticket Issues - Non Work Stoppage">Ticket Issues - Non Work Stoppage</option>
            </select>
            <br>

            <button type="submit">Submit Ticket</button>
        </form>
    </div>

    <div class="priority_table">
        <table>
            <tr>
                <th>Complete</th>
                <th>Username</th>
                <th>Priority</th>
                <th>Description</th>
                <th>Issue Type</th>
            </tr>

            {% for task in tasks %}
            <form action="{{ url_for('remove_task', ticket=task.ticket) }}" method="POST" id="completionform" name="completionform">
                <tr>
                    <td>
                        <button 
                            id="completionbutton" name="completionbutton" type="Submit">Done
                        </button>
                    </td>
                    <td>{{ task.username }}</td>
                    <td>{{ task.priority }}</td>
                    <td>{{ task.description }}</td>
                    <td>{{ task.issuetype }}</td>
                </tr>
            </form>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
